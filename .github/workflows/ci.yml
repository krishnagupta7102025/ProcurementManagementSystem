name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  lint-typecheck-test-build:
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8
        env:
          MYSQL_ROOT_PASSWORD: p2p
          MYSQL_USER: p2p
          MYSQL_PASSWORD: p2p
          MYSQL_DATABASE: p2p
        ports:
          - 3306:3306
        options: >-
          --health-cmd "mysqladmin ping -h localhost -p$MYSQL_ROOT_PASSWORD"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: mysql://p2p:p2p@localhost:3306/p2p
      AUTH_JWT_SECRET: ci-only-secret-never-used-outside-this-workflow

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Apply migrations
        run: pnpm --filter api exec prisma migrate deploy

      - name: Lint
        run: pnpm run lint

      - name: Typecheck
        run: pnpm run typecheck

      - name: Test
        run: pnpm run test

      - name: E2E smoke test (boots the full AppModule)
        run: pnpm --filter api run test:e2e

      - name: Build
        run: pnpm run build
