services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: p2p
      POSTGRES_PASSWORD: p2p
      POSTGRES_DB: p2p
    ports:
      - '5432:5432'
    volumes:
      - p2p_postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7
    ports:
      - '6379:6379'

volumes:
  p2p_postgres_data:
