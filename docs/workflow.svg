<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 2400 1410" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrowGray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#374151"/>
    </marker>
    <marker id="arrowRed" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#DC2626"/>
    </marker>
    <marker id="arrowGreen" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#16A34A"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="2400" height="1410" fill="#FFFFFF"/>

  <!-- Title -->
  <text x="1200" y="55" text-anchor="middle" font-size="34" font-weight="700" fill="#111827">Losung360 Procure-to-Pay — Workflow</text>
  <text x="1200" y="90" text-anchor="middle" font-size="18" fill="#6B7280">Phase 0 scope: Requisition → Approval → PO → Goods Receipt → Invoice → Match → Payment → GL Export</text>

  <!-- ===== Main flow arrows ===== -->
  <line x1="320" y1="500" x2="356" y2="500" stroke="#374151" stroke-width="3" marker-end="url(#arrowGray)"/>
  <line x1="564" y1="500" x2="596" y2="500" stroke="#374151" stroke-width="3" marker-end="url(#arrowGray)"/>
  <line x1="860" y1="500" x2="896" y2="500" stroke="#374151" stroke-width="3" marker-end="url(#arrowGray)"/>
  <line x1="1160" y1="500" x2="1196" y2="500" stroke="#374151" stroke-width="3" marker-end="url(#arrowGray)"/>
  <line x1="1460" y1="500" x2="1496" y2="500" stroke="#374151" stroke-width="3" marker-end="url(#arrowGray)"/>
  <line x1="1704" y1="500" x2="1736" y2="500" stroke="#374151" stroke-width="3" marker-end="url(#arrowGray)"/>
  <line x1="2000" y1="500" x2="2036" y2="500" stroke="#374151" stroke-width="3" marker-end="url(#arrowGray)"/>

  <text x="440" y="480" text-anchor="middle" font-size="15" fill="#16A34A" font-weight="600">approved</text>
  <text x="1580" y="480" text-anchor="middle" font-size="15" fill="#16A34A" font-weight="600">clean match</text>

  <!-- ===== 1. Requisition ===== -->
  <rect x="60" y="430" width="260" height="140" rx="14" fill="#EEF2FF" stroke="#4F46E5" stroke-width="2.5"/>
  <text x="190" y="490" text-anchor="middle" font-size="20" font-weight="700" fill="#1E1B4B">Requisition</text>
  <text x="190" y="516" text-anchor="middle" font-size="14" fill="#3730A3">Requester creates &amp;</text>
  <text x="190" y="536" text-anchor="middle" font-size="14" fill="#3730A3">submits (PR)</text>

  <!-- ===== 2. Approval diamond ===== -->
  <polygon points="360,500 460,400 560,500 460,600" fill="#FEF3C7" stroke="#D97706" stroke-width="2.5"/>
  <text x="460" y="495" text-anchor="middle" font-size="17" font-weight="700" fill="#78350F">Approval</text>
  <text x="460" y="516" text-anchor="middle" font-size="13" fill="#92400E">rule-based chain</text>
  <text x="460" y="655" text-anchor="middle" font-size="13" font-style="italic" fill="#9CA3AF">SLA: 48h reminder / 96h escalate</text>

  <!-- ===== 3. Purchase Order ===== -->
  <rect x="600" y="430" width="260" height="140" rx="14" fill="#EDE9FE" stroke="#7C3AED" stroke-width="2.5"/>
  <text x="730" y="490" text-anchor="middle" font-size="20" font-weight="700" fill="#3B0764">Purchase Order</text>
  <text x="730" y="516" text-anchor="middle" font-size="14" fill="#5B21B6">Buyer issues PO to</text>
  <text x="730" y="536" text-anchor="middle" font-size="14" fill="#5B21B6">vendor</text>

  <!-- ===== 4. Goods Receipt ===== -->
  <rect x="900" y="430" width="260" height="140" rx="14" fill="#EDE9FE" stroke="#7C3AED" stroke-width="2.5"/>
  <text x="1030" y="490" text-anchor="middle" font-size="20" font-weight="700" fill="#3B0764">Goods Receipt</text>
  <text x="1030" y="516" text-anchor="middle" font-size="14" fill="#5B21B6">GRN / service</text>
  <text x="1030" y="536" text-anchor="middle" font-size="14" fill="#5B21B6">confirmation</text>

  <!-- ===== 5. Invoice ===== -->
  <rect x="1200" y="430" width="260" height="140" rx="14" fill="#FFEDD5" stroke="#EA580C" stroke-width="2.5"/>
  <text x="1330" y="490" text-anchor="middle" font-size="20" font-weight="700" fill="#7C2D12">Invoice</text>
  <text x="1330" y="516" text-anchor="middle" font-size="14" fill="#9A3412">AP enters / uploads,</text>
  <text x="1330" y="536" text-anchor="middle" font-size="14" fill="#9A3412">links to PO(s)</text>

  <!-- ===== 6. Match diamond ===== -->
  <polygon points="1500,500 1600,400 1700,500 1600,600" fill="#FEF3C7" stroke="#D97706" stroke-width="2.5"/>
  <text x="1600" y="495" text-anchor="middle" font-size="17" font-weight="700" fill="#78350F">Match</text>
  <text x="1600" y="516" text-anchor="middle" font-size="13" fill="#92400E">2-way / 3-way</text>

  <!-- ===== 7. Payment ===== -->
  <rect x="1740" y="430" width="260" height="140" rx="14" fill="#DCFCE7" stroke="#16A34A" stroke-width="2.5"/>
  <text x="1870" y="490" text-anchor="middle" font-size="20" font-weight="700" fill="#14532D">Payment</text>
  <text x="1870" y="516" text-anchor="middle" font-size="14" fill="#166534">Batch, 2nd-approver,</text>
  <text x="1870" y="536" text-anchor="middle" font-size="14" fill="#166534">release</text>

  <!-- ===== 8. GL Export ===== -->
  <rect x="2040" y="430" width="260" height="140" rx="14" fill="#DCFCE7" stroke="#16A34A" stroke-width="2.5"/>
  <text x="2170" y="490" text-anchor="middle" font-size="20" font-weight="700" fill="#14532D">GL Export</text>
  <text x="2170" y="516" text-anchor="middle" font-size="14" fill="#166534">Postable entries</text>
  <text x="2170" y="536" text-anchor="middle" font-size="14" fill="#166534">(CSV)</text>

  <!-- ===== Reject / Request-changes loop (Approval -> Requisition) ===== -->
  <path d="M 460,600 L 460,730 L 190,730 L 190,574" fill="none" stroke="#DC2626" stroke-width="2.5" stroke-dasharray="8,6" marker-end="url(#arrowRed)"/>
  <text x="325" y="718" text-anchor="middle" font-size="14" fill="#DC2626" font-weight="600">reject / request changes</text>

  <!-- ===== PO variance -> re-approval loop ===== -->
  <path d="M 730,430 L 730,300 L 460,300 L 460,396" fill="none" stroke="#DC2626" stroke-width="2.5" stroke-dasharray="8,6" marker-end="url(#arrowRed)"/>
  <text x="595" y="280" text-anchor="middle" font-size="14" fill="#DC2626" font-weight="600">variance &gt;10% → re-approve</text>

  <!-- ===== Match exception queue ===== -->
  <rect x="1470" y="800" width="260" height="130" rx="14" fill="#FEE2E2" stroke="#DC2626" stroke-width="2.5"/>
  <text x="1600" y="850" text-anchor="middle" font-size="18" font-weight="700" fill="#7F1D1D">Match Exception</text>
  <text x="1600" y="874" text-anchor="middle" font-size="13" fill="#991B1B">credit note / adjust /</text>
  <text x="1600" y="893" text-anchor="middle" font-size="13" fill="#991B1B">override (audited)</text>

  <path d="M 1580,600 L 1580,796" fill="none" stroke="#DC2626" stroke-width="2.5" stroke-dasharray="8,6" marker-end="url(#arrowRed)"/>
  <text x="1470" y="700" text-anchor="middle" font-size="13" fill="#DC2626" font-weight="600">out of tolerance</text>

  <path d="M 1622,796 L 1622,600" fill="none" stroke="#16A34A" stroke-width="2.5" stroke-dasharray="8,6" marker-end="url(#arrowGreen)"/>
  <text x="1740" y="700" text-anchor="middle" font-size="13" fill="#16A34A" font-weight="600">resolved → re-match</text>

  <!-- ===== Supporting reference boxes (dashed gray) ===== -->
  <rect x="600" y="760" width="260" height="110" rx="12" fill="#F9FAFB" stroke="#9CA3AF" stroke-width="2" stroke-dasharray="6,5"/>
  <text x="730" y="800" text-anchor="middle" font-size="15" font-weight="600" fill="#374151">Vendor Master</text>
  <text x="730" y="822" text-anchor="middle" font-size="13" fill="#6B7280">active vendors only</text>
  <line x1="730" y1="760" x2="730" y2="574" stroke="#9CA3AF" stroke-width="2" stroke-dasharray="6,5" marker-end="url(#arrowGray)"/>

  <rect x="1740" y="760" width="260" height="110" rx="12" fill="#F9FAFB" stroke="#9CA3AF" stroke-width="2" stroke-dasharray="6,5"/>
  <text x="1870" y="800" text-anchor="middle" font-size="15" font-weight="600" fill="#374151">Bank Statement</text>
  <text x="1870" y="822" text-anchor="middle" font-size="13" fill="#6B7280">CSV reconciliation</text>
  <line x1="1870" y1="760" x2="1870" y2="574" stroke="#9CA3AF" stroke-width="2" stroke-dasharray="6,5" marker-end="url(#arrowGray)"/>

  <rect x="2040" y="760" width="260" height="110" rx="12" fill="#F9FAFB" stroke="#9CA3AF" stroke-width="2" stroke-dasharray="6,5"/>
  <text x="2170" y="795" text-anchor="middle" font-size="15" font-weight="600" fill="#374151">Accounting System</text>
  <text x="2170" y="818" text-anchor="middle" font-size="13" fill="#6B7280">CSV now, API in Phase 1</text>
  <line x1="2170" y1="760" x2="2170" y2="574" stroke="#9CA3AF" stroke-width="2" stroke-dasharray="6,5" marker-end="url(#arrowGray)"/>

  <!-- ===== Legend ===== -->
  <g transform="translate(60,1240)">
    <rect x="0" y="0" width="2280" height="120" rx="12" fill="#F9FAFB" stroke="#E5E7EB" stroke-width="1.5"/>
    <text x="24" y="30" font-size="16" font-weight="700" fill="#111827">Legend</text>

    <line x1="24" y1="60" x2="74" y2="60" stroke="#374151" stroke-width="3" marker-end="url(#arrowGray)"/>
    <text x="84" y="65" font-size="14" fill="#374151">Happy path</text>

    <line x1="260" y1="60" x2="310" y2="60" stroke="#DC2626" stroke-width="2.5" stroke-dasharray="8,6" marker-end="url(#arrowRed)"/>
    <text x="320" y="65" font-size="14" fill="#374151">Rejection / exception path</text>

    <line x1="620" y1="60" x2="670" y2="60" stroke="#16A34A" stroke-width="2.5" stroke-dasharray="8,6" marker-end="url(#arrowGreen)"/>
    <text x="680" y="65" font-size="14" fill="#374151">Resolution back into flow</text>

    <line x1="960" y1="60" x2="1010" y2="60" stroke="#9CA3AF" stroke-width="2" stroke-dasharray="6,5" marker-end="url(#arrowGray)"/>
    <text x="1020" y="65" font-size="14" fill="#374151">Supporting reference (not a workflow stage)</text>

    <text x="24" y="95" font-size="13" fill="#6B7280">Full detail: docs/00-prd.md §4 (Core Workflow). Phase 0 ships every stage shown; OCR, vendor portal, and payment-API initiation are Phase 1+.</text>
  </g>
</svg>
