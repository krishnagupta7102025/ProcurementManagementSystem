services:
  - type: web
    name: p2p-api
    runtime: docker
    dockerfilePath: ./apps/api/Dockerfile
    dockerContext: .
    plan: free
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 3001
      - key: DATABASE_URL
        fromDatabase:
          name: p2p-postgres
          property: connectionString
      - key: AUTH_JWT_SECRET
        generateValue: true
      # Everything below has no safe default and must be filled in by hand
      # in the Render dashboard (Environment tab) after the first deploy —
      # see docs/deploy-github-pages-render.md.
      - key: REDIS_URL
        sync: false
      - key: S3_BUCKET
        sync: false
      - key: S3_REGION
        sync: false
      - key: S3_ENDPOINT
        sync: false
      - key: AWS_ACCESS_KEY_ID
        sync: false
      - key: AWS_SECRET_ACCESS_KEY
        sync: false
      - key: CORS_ALLOWED_ORIGINS
        sync: false
      - key: NOTIFICATION_CENTER_API_URL
        value: ''

databases:
  - name: p2p-postgres
    plan: free
    databaseName: p2p
    user: p2p
